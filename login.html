<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Muscle Tonik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1 data-auth-title>Welcome back</h1>
      <p class="sub">Sign in to manage your cart, wishlist and orders.</p>
      <form data-endpoint="/auth/login" data-success-redirect="dashboard.html">
        <div class="field">
          <label>Email or Mobile Number</label>
          <input name="identifier" type="text" autocomplete="username" placeholder="you@email.com or 98765 43210" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-field">
            <input name="password" type="password" autocomplete="current-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field" style="display:flex;justify-content:space-between;align-items:center;">
          <label style="margin:0;font-weight:500;"><input name="rememberMe" type="checkbox" style="accent-color:var(--primary);margin-right:8px;">Remember me</label>
          <a href="forgot-password.html" style="font-size:13px;color:var(--primary);font-weight:700;">Forgot password?</a>
        </div>
        <p class="form-error" role="alert" style="color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px;"></p>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>
      <p class="auth-foot">New here? <a href="register.html">Create account</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
