<body data-protected>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1>Change password</h1>
      <p class="sub">Use your current password to set a new one.</p>
      <form data-endpoint="/auth/change-password" data-strength-check>
        <div class="field">
          <label>Current Password</label>
          <div class="password-field">
            <input name="currentPassword" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field">
          <label>New Password</label>
          <div class="password-field">
            <input name="newPassword" type="password" autocomplete="new-password" minlength="8" data-strength="pwStrength" required>
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
          <div class="pw-strength" id="pwStrength">
            <div class="pw-strength-bar"><span></span></div>
            <div class="pw-strength-label"></div>
          </div>
          <p class="field-hint">Use at least 8 characters with letters and numbers.</p>
        </div>
        <p class="form-error" role="alert" style="color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px;"></p>
        <button class="btn btn-primary btn-block" type="submit">Save password</button>
      </form>
      <p class="auth-foot"><a href="profile.html">Back to account</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/config.js?v=2"></script>

</body>
