<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Muscle Tonik</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1>Verify email</h1>
      <p class="sub">Confirm your inbox token to activate your account.</p>
      <form data-endpoint="/auth/verify-email">
        <div class="field"><label>Verification Token</label><input id="tokenInput" name="token" type="text" required></div>
        <button class="btn btn-primary btn-block" type="submit">Verify email</button>
      </form>
      <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
