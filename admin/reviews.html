<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews · Muscle Tonik Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<div class="admin-layout">
  <div class="a-backdrop"></div>
  <aside class="a-sidebar" id="aSidebar"></aside>
  <div class="a-main">
    <header class="a-topbar" id="aTopbar"></header>
    <div class="a-content" id="aContent"></div>
  </div>
</div>
<div class="a-modal-back" id="reviewModalBack">
  <div class="a-modal" style="max-width:760px;">
    <div class="a-modal-head"><span id="reviewModalTitle">Review</span><button class="a-icon-btn" id="reviewModalClose" style="border:none;">×</button></div>
    <form id="reviewForm">
      <div class="a-modal-body" id="reviewModalBody"></div>
      <div class="a-modal-foot">
        <button type="button" class="a-btn ghost" id="reviewCancel">Cancel</button>
        <button type="submit" class="a-btn primary" id="reviewSave">Save review</button>
      </div>
    </form>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/admin/admin-core.js"></script>
<script src="/js/admin/reviews.js"></script>
</body>
</html>
