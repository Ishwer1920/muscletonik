<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Muscle Tonik</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1>Set new password</h1>
      <p class="sub">Use the token from your email or the development response.</p>
      <form data-endpoint="/auth/reset-password">
        <div class="field"><label>Reset Token</label><input id="tokenInput" name="token" type="text" required></div>
        <div class="field"><label>New Password</label><input name="password" type="password" minlength="8" required></div>
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
      <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
