<body>
<div id="site-header"></div>

<div class="page-head">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <span>Cart</span></div>
    <h1>Your Cart</h1>
  </div>
</div>

<main class="section-tight">
  <div class="container">
    <div class="empty-state" id="cartEmpty" style="display:none;">
      <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
      <h3>Your cart is empty</h3>
      <p style="color:var(--text-light);margin:10px 0 22px;">Looks like you haven't added anything yet.</p>
      <a href="marketplace.html" class="btn btn-primary">Browse Products</a>
    </div>

    <div class="cart-layout">
      <div>
        <div id="cartItems"></div>
      </div>
      <div class="summary-box" id="cartSummaryWrap">
        <h3 style="font-size:16px;margin-bottom:14px;">Order Summary</h3>
        <div class="coupon-row">
          <input type="text" id="couponInput" placeholder="Coupon code" autocomplete="off" autocapitalize="characters">
          <button class="btn btn-dark btn-sm" onclick="applyCoupon()">Apply</button>
        </div>
        <p class="coupon-note" id="couponNote"></p>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
        <div class="summary-row"><span>Coupon Discount</span><span id="sumDiscount"></span></div>
        <div class="summary-row"><span id="sumGstLabel">GST</span><span id="sumGst"></span></div>
        <div class="summary-row"><span>Delivery Charges</span><span id="sumShipping"></span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Checkout</a>
      </div>
    </div>
  </div>
</main>

<footer class="site" id="site-footer"></footer>

<script src="js/config.js?v=2"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
