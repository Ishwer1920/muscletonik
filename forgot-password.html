<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Muscle Tonik</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1>Reset access</h1>
      <p class="sub">We’ll prepare a password reset link for your account.</p>
      <form data-endpoint="/auth/forgot-password">
        <div class="field"><label>Email</label><input name="email" type="email" required></div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
