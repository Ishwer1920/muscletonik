<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Muscle Tonik</title>
<meta name="description" content="Reset your Muscle Tonik password with a one-time code sent to your email or registered mobile number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="section">
  <div class="container">
    <div class="auth-wrap">
      <h1 id="otpTitle">Reset your password</h1>
      <p class="sub" id="otpSub">Enter the email address or mobile number you signed up with.</p>

      <ol class="otp-steps" id="otpSteps">
        <li class="active" data-step="1">Account</li>
        <li data-step="2">Send code</li>
        <li data-step="3">Verify</li>
        <li data-step="4">New password</li>
      </ol>

      <!-- Step 1 - who is resetting -->
      <form id="stepIdentify" class="otp-step">
        <div class="field">
          <label>Email or mobile number</label>
          <input name="identifier" type="text" autocomplete="username" placeholder="you@example.com or 9876543210" required>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Continue</button>
      </form>

      <!-- Step 2 - where should the code go -->
      <form id="stepChannel" class="otp-step" hidden>
        <p class="field-hint" style="margin-bottom:10px;">Where should we send your verification code?</p>
        <div id="channelChoices" class="otp-channels"></div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Send code</button>
        <button class="btn btn-ghost btn-block" type="button" data-back="1" style="margin-top:8px;">Use a different account</button>
      </form>

      <!-- Step 3 - the code itself -->
      <form id="stepVerify" class="otp-step" hidden>
        <div class="field">
          <label>Verification code</label>
          <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]*" maxlength="8" placeholder="6-digit code" required
                 style="letter-spacing:6px;font-size:18px;text-align:center;">
          <p class="field-hint" id="otpSentTo"></p>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Verify code</button>
        <button class="btn btn-ghost btn-block" type="button" id="otpResend" style="margin-top:8px;" disabled>Resend code</button>
        <button class="btn btn-ghost btn-block" type="button" data-back="2" style="margin-top:8px;">Send it somewhere else</button>
      </form>

      <!-- Step 4 - new password -->
      <form id="stepPassword" class="otp-step" hidden>
        <div class="field">
          <label>New password</label>
          <div class="password-field">
            <input name="password" type="password" autocomplete="new-password" minlength="8" data-strength="pwStrength" required>
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
          <div class="pw-strength" id="pwStrength">
            <div class="pw-strength-bar"><span></span></div>
            <div class="pw-strength-label"></div>
          </div>
          <p class="field-hint">Use at least 8 characters with letters and numbers.</p>
        </div>
        <div class="field">
          <label>Confirm new password</label>
          <div class="password-field">
            <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>

      <p class="auth-foot"><a href="login.html">Back to login</a></p>
    </div>
  </div>
</main>
<footer class="site" id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
